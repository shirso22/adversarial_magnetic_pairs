[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-pairs"
version = "1.1.0"
description = "Topologically distinct magnetization textures with near-identical stray fields"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Shirsopratim Chattopadhyay" }]
dependencies = ["numpy", "scipy", "matplotlib", "torch>=1.13"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
adversarial-pairs = "adversarial_pairs.cli:main"

[tool.setuptools]
packages = ["adversarial_pairs"]
